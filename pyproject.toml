[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdm-math-swarm"
version = "0.1.0"
description = "Documented reconstruction of the DeepMind Lean research-swarm case study"
requires-python = ">=3.10"
# The keyword filter, ledger, launch gates and offline tests need only the standard library.
dependencies = []

[project.optional-dependencies]
# Pinned runtime stack (verified installed in .venv, Python 3.10.12, 2026-10-13).
# Changing these requires re-validating the Inspect SWE / Claude Code bridge.
runtime = [
    "inspect-ai==0.3.279",
    "inspect-swe==0.2.71",
    "anthropic==1.13.0",
    "openai==3.29.0",
]

publication = ["huggingface-hub==1.10.1", "zipfile-zstd==0.0.4"]

[project.scripts]
gdm-math-keyword-check = "research_swarm.keyword_filter:main"

[tool.setuptools.packages.find]
where = ["src"]
